<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoberLab | Device</title>
    <meta name="description" content="Specs, rating, pros and cons and conversion guide for a home-lab device.">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <script>
      // Runs before the page paints: pick a theme (saved choice, else OS/browser
      // preference) so there's no flash of the wrong theme on load.
      (function () {
        try {
          var t = localStorage.getItem('boberlab-theme');
          if (t !== 'dark' && t !== 'light') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* default light stays */ }
      })();
    </script>
    <script src="https://unpkg.com/i18next@23.7.11/i18next.min.js"></script>
</head>
<body data-page="devices">
    <div id="site-header"></div>

    <main class="container">
        <nav class="breadcrumb" aria-label="breadcrumb">
            <a href="devices.html" data-i18n="breadcrumb-all"></a>
            <span class="sep">›</span>
            <a href="devices.html" id="crumb-type"></a>
            <span class="sep">›</span>
            <span id="crumb-name"></span>
        </nav>

        <h1 class="page-title" id="device-name">…</h1>

        <div class="device-hero">
            <div class="card gallery-card">
                <div class="gallery-main">
                    <img id="gallery-main-img" src="" alt="" style="display:none;">
                    <div class="gallery-empty" id="gallery-empty" data-i18n="gallery-empty" style="display:none;"></div>
                </div>
                <div class="gallery-thumbs" id="gallery-thumbs"></div>
            </div>
            <div class="card rating-card">
                <h3 data-i18n="section-rating"></h3>
                <div class="hexagon-wrap" id="hexagon-wrap"></div>
            </div>
        </div>

        <div class="pros-cons">
            <div class="card pros">
                <h3 data-i18n="section-pros"></h3>
                <ul id="pros-list"></ul>
            </div>
            <div class="card cons">
                <h3 data-i18n="section-cons"></h3>
                <ul id="cons-list"></ul>
            </div>
        </div>

        <div class="card section-card">
            <h3 data-i18n="section-specs"></h3>
            <table class="specs-table" id="specs-table"></table>
        </div>

        <div class="card section-card">
            <h3 data-i18n="section-description"></h3>
            <p id="description-text"></p>
        </div>

        <div class="card section-card">
            <h3 data-i18n="section-instructions"></h3>
            <div class="instructions-video" id="instructions-video" style="display:none;"></div>
            <ol class="instructions-steps" id="instructions-steps"></ol>
        </div>

        <p><a href="devices.html" data-i18n="back-link"></a></p>
    </main>

    <div id="site-footer"></div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/device.js"></script>
</body>
</html>
