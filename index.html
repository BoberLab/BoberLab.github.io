<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoberLab | Home Lab Devices</title>
    <link rel="stylesheet" href="style.css">
    <script>
      // Runs before the page paints: pick a theme (saved choice, else OS/browser
      // preference) so there's no flash of the wrong theme on load.
      (function () {
        try {
          var t = localStorage.getItem('boberlab-theme');
          if (t !== 'dark' && t !== 'light') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* localStorage/matchMedia unavailable, default light stays */ }
      })();
    </script>
    <script src="https://unpkg.com/i18next@23.7.11/i18next.min.js"></script>
</head>
<body>

    <div class="header-box">
        <div>
            <div class="site-title" id="site-title"></div>
            <h1 id="main-title">BoberLab</h1>
        </div>
        <div class="nav-controls">
            <div class="lang-btns">
                <button data-lang="en" onclick="changeLang('en')">EN</button>
                <button data-lang="ru" onclick="changeLang('ru')">RU</button>
                <button data-lang="pl" onclick="changeLang('pl')">PL</button>
            </div>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"></button>
        </div>
    </div>

    <div class="intro">
        <h2 id="intro-title"></h2>
        <p id="intro-text"></p>
    </div>

    <div class="controls">
        <span class="filters-label" id="filters-label"></span>
        <div class="filters" id="filters"></div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th onclick="sortTable('name')" id="th-device"></th>
                    <th class="col-cores" onclick="sortTable('cores')" id="th-cores"></th>
                    <th class="col-tdp" onclick="sortTable('core-tdp')" id="th-tdp"></th>
                    <th class="col-nm" onclick="sortTable('nm')" id="th-nm"></th>
                    <th onclick="sortTable('ram')" id="th-ram"></th>
                    <th onclick="sortTable('rom')" id="th-rom"></th>
                    <th id="th-os"></th>
                    <th class="col-power" onclick="sortTable('powerW')" id="th-power-orig"></th>
                    <th class="col-power" id="th-power-new"></th>
                    <th onclick="sortTable('antu')" id="th-antu"></th>
                    <th onclick="sortTable('benchmark')" id="th-score"></th>
                    <th onclick="sortTable('sysbench')" id="th-sysbench"></th>
                    <th id="th-ebay"></th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <footer class="site-footer">
        <p id="footer-project"></p>
        <p id="footer-disclaimer"></p>
    </footer>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>
