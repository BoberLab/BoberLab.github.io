<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoberLab | Home Lab Devices</title>
    <meta name="description" content="Turn old phones, mini PCs, tablets and TV boxes into low-power home servers. Tested devices, guides and server accessories.">
    <link rel="icon" type="image/svg+xml" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script>
      // Runs before the page paints: pick a theme (saved choice, else OS/browser
      // preference) so there's no flash of the wrong theme on load.
      (function () {
        try {
          var t = localStorage.getItem('boberlab-theme');
          if (t !== 'dark' && t !== 'light') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* default light stays */ }
      })();
    </script>
    <script src="https://unpkg.com/i18next@23.7.11/i18next.min.js"></script>
</head>
<body data-page="home">
    <div id="site-header"></div>

    <main class="container">
        <section class="card hero">
            <img class="hero-logo" src="assets/logo.png" alt="BoberLab beaver" width="140" height="140">
            <div>
                <h1 data-i18n="intro-title"></h1>
                <p data-i18n="intro-text"></p>
                <div class="hero-actions">
                    <a class="btn primary" href="devices.html" data-i18n="cta-devices"></a>
                    <a class="btn" href="accessories.html" data-i18n="cta-accessories"></a>
                </div>
            </div>
        </section>

        <div class="home-layout">
            <section class="home-main">
                <h2 data-i18n="home-categories"></h2>
                <div class="cat-grid" id="cat-grid"></div>

                <h2 data-i18n="home-all-devices"></h2>
                <div class="table-wrap">
                    <table class="mini-table">
                        <thead>
                            <tr>
                                <th data-i18n="th-device"></th>
                                <th data-i18n="th-cores"></th>
                                <th data-i18n="th-ram"></th>
                                <th data-i18n="th-rom"></th>
                                <th data-i18n="th-power-new"></th>
                                <th data-i18n="th-sysbench"></th>
                            </tr>
                        </thead>
                        <tbody id="home-table-body"></tbody>
                    </table>
                </div>
            </section>

            <aside class="sidebar">
                <section class="card rank-card"><h3 data-i18n="rank-popular"></h3><ol class="rank-list" id="rank-popular"></ol></section>
                <section class="card rank-card"><h3 data-i18n="rank-powerful"></h3><ol class="rank-list" id="rank-powerful"></ol></section>
                <section class="card rank-card"><h3 data-i18n="rank-stable"></h3><ol class="rank-list" id="rank-stable"></ol></section>
                <section class="card rank-card"><h3 data-i18n="rank-controllable"></h3><ol class="rank-list" id="rank-controllable"></ol></section>
            </aside>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
